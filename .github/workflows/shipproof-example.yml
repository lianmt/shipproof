name: ShipProof example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shipproof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - uses: ./
        with:
          config: shipproof.yml
          task: task.md
          cwd: fixtures/node-basic
