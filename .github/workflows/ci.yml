name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run benchmark
      - name: Verify runnable fixture
        working-directory: fixtures/node-basic
        run: |
          node ../../dist/cli.js lock --task task.md
          node ../../dist/cli.js verify --task task.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shipproof-evidence
          path: |
            benchmark/results
            fixtures/node-basic/.shipproof/runs
